name: Evaluate sample submission

on:
  pull_request:
  push:
    branches: [main]

jobs:
  evaluate-sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Evaluate sample agent
        run: python3 evaluator/run_submission.py examples/sample-agent
